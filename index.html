
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locker</title>
    <link rel="icon" type="image/png" href="https://aayushbaralsite.wordpress.com/wp-content/uploads/2026/08/locker-app-title-logo.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="https://aayushbaralsite.wordpress.com/wp-content/uploads/2026/08/locker-app-title-logo.png">
    <meta name="theme-color" content="#4f46e5">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Locker">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(registration) {
            console.log('SW registered: ', registration.scope);
          }).catch(function(err) {
            console.log('SW registration failed: ', err);
          });
        });
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
